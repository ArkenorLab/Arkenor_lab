<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="logoTurq" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00BFA5" />
      <stop offset="100%" stop-color="#00A88F" />
    </linearGradient>
    <linearGradient id="logoFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D303B" />
      <stop offset="100%" stop-color="#101C25" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ISOTYPE (Symbol) -->
  <g transform="translate(10, 8) scale(0.64)">
    <!-- Hexagon -->
    <polygon points="50,8 86,28 86,72 50,92 14,72 14,28" 
             stroke="url(#logoTurq)" 
             stroke-width="2.8" 
             stroke-linejoin="round"
             fill="url(#logoFacet)" 
             fill-opacity="0.9"/>
    <!-- Inner lines -->
    <line x1="50" y1="14" x2="50" y2="50" stroke="#00BFA5" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="80" y1="69" x2="50" y2="50" stroke="#00BFA5" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="20" y1="69" x2="50" y2="50" stroke="#00BFA5" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Nodes -->
    <circle cx="50" cy="50" r="5.5" fill="#00BFA5" filter="url(#logoGlow)"/>
    <circle cx="50" cy="50" r="2.5" fill="#FFFFFF"/>
    <circle cx="50" cy="14" r="3.2" fill="#F4F7F8" stroke="#00BFA5" stroke-width="1.5"/>
    <circle cx="80" cy="69" r="3.2" fill="#F4F7F8" stroke="#00BFA5" stroke-width="1.5"/>
    <circle cx="20" cy="69" r="3.2" fill="#F4F7F8" stroke="#00BFA5" stroke-width="1.5"/>
  </g>

  <!-- BRAND TYPOGRAPHY -->
  <g transform="translate(86, 0)">
    <!-- Brand Name: ARKENOR LABS -->
    <text x="0" y="44" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="800" font-size="28" letter-spacing="3.5" fill="#FFFFFF">
      ARKENOR <tspan fill="#00BFA5">LABS</tspan>
    </text>

    <!-- Descriptor: AUTOMATION · SOFTWARE · INTEGRATION -->
    <text x="1.5" y="64" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="500" font-size="9" letter-spacing="3.2" fill="#84939B">
      AUTOMATION <tspan fill="#00BFA5">·</tspan> SOFTWARE <tspan fill="#00BFA5">·</tspan> INTEGRATION
    </text>
  </g>
</svg>

