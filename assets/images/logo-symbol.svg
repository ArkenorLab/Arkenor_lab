<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="arkenorGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00BFA5" />
      <stop offset="100%" stop-color="#00A88F" />
    </linearGradient>
    <linearGradient id="nodeFacet1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D303B" />
      <stop offset="100%" stop-color="#101C25" />
    </linearGradient>
    <linearGradient id="nodeFacet2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#20292D" />
      <stop offset="100%" stop-color="#1D303B" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Isometric Hexagonal Tech Shell -->
  <polygon points="50,8 86,28 86,72 50,92 14,72 14,28" 
           stroke="url(#arkenorGlow)" 
           stroke-width="2.5" 
           stroke-linejoin="round"
           fill="url(#nodeFacet1)" 
           fill-opacity="0.85"/>

  <!-- Inner Triad Geometric Nodes -->
  <!-- Top Facet -->
  <polygon points="50,14 80,31 50,50 20,31" 
           fill="url(#nodeFacet2)" 
           stroke="#00BFA5" 
           stroke-width="1.2" 
           stroke-opacity="0.4"/>

  <!-- Left Lower Facet -->
  <polygon points="20,35 50,52 50,86 20,69" 
           fill="#101C25" 
           fill-opacity="0.9"
           stroke="#00BFA5" 
           stroke-width="1.2" 
           stroke-opacity="0.4"/>

  <!-- Right Lower Facet -->
  <polygon points="50,52 80,35 80,69 50,86" 
           fill="#1D303B" 
           stroke="#00BFA5" 
           stroke-width="1.2" 
           stroke-opacity="0.4"/>

  <!-- Central Nexus Core Connection -->
  <line x1="50" y1="14" x2="50" y2="50" stroke="#00BFA5" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="80" y1="69" x2="50" y2="50" stroke="#00BFA5" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="20" y1="69" x2="50" y2="50" stroke="#00BFA5" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Central Core Glowing Pulse Dot -->
  <circle cx="50" cy="50" r="5.5" fill="#00BFA5" filter="url(#subtleGlow)"/>
  <circle cx="50" cy="50" r="2.5" fill="#FFFFFF"/>

  <!-- Peripheral Satellite Nodes -->
  <circle cx="50" cy="14" r="3.2" fill="#F4F7F8" stroke="#00BFA5" stroke-width="1.5"/>
  <circle cx="80" cy="31" r="2.5" fill="#00BFA5"/>
  <circle cx="80" cy="69" r="3.2" fill="#F4F7F8" stroke="#00BFA5" stroke-width="1.5"/>
  <circle cx="50" cy="86" r="2.5" fill="#00BFA5"/>
  <circle cx="20" cy="69" r="3.2" fill="#F4F7F8" stroke="#00BFA5" stroke-width="1.5"/>
  <circle cx="20" cy="31" r="2.5" fill="#00BFA5"/>
</svg>

